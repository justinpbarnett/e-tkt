; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Keeps a bare `pio run` on the two real firmware builds, exactly as it was
; before the native env was added. That env builds no sources and exists only
; for `pio test -e native`, so listing it here would just mean an empty build.
default_envs = serial-upload, ota-upload

; The Api's JSON library, which the board and the native tests both build.
; Named once, so the two can never resolve different versions.
[json]
lib_deps = bblanchon/ArduinoJson@^6.20.0

; The stepper library. The board turns its motors with it, and the native
; tests and the simulator time their fake ones by it, so a move takes as long
; there as on the machine. Named once, like the JSON library.
;
; Pinned, not ^1.61: StepperTiming in src/Motion.cpp copies this version's
; speed ramp line for line to say how long a label takes, and the native
; tests hold the copy to the library. So a new version is one to take on
; purpose, with the tests run against it.
[stepper]
lib_deps = waspinator/AccelStepper@1.64

[esp32]
platform = espressif32@3.3.2
framework = arduino
board = nodemcu-32s
build_flags = -DASYNCWEBSERVER_REGEX
; The bench rigs in src/bench/ are firmwares of their own, each with its own
; setup() and loop(), and the simulator in src/simulator/ is a program for the
; host, so the label maker leaves them all out.
build_src_filter = +<*> -<bench/> -<simulator/>
monitor_speed = 115200
monitor_filters =
extra_scripts = pre:scripts/gzip_panel.py
lib_deps =
	${stepper.lib_deps}
	madhephaestus/ESP32Servo@^0.9.0
	olikraus/U8g2@^2.28.8
	ricmoo/QRCode@^0.0.1
	${json.lib_deps}
	; upstream rot 2026-09: 3.2.2+ assume Arduino core 3.x macros that the pinned
	; espressif32@3.3.2 (core 1.0.6) lacks. 3.0.0 is what ^3.0.0 meant in May 2023.
	ottowinter/ESPAsyncWebServer-esphome@3.0.0
	; upstream rot 2026-09: pulled from the PlatformIO registry (404); repo archived
	; but intact. v2.2.9 adds a hard #error deprecation notice, so pin v2.2.8,
	; the last clean tag satisfying the original ^2.2.5.
	https://github.com/ayushsharma82/AsyncElegantOTA.git#v2.2.8

[env:serial-upload]
extends = esp32
upload_protocol = esptool

[env:ota-upload]
extends = esp32
extra_scripts =
    pre:scripts/gzip_panel.py
    src/ota/upload.py
upload_protocol = custom
; Each machine answers to a name of its own, which its log says as it starts:
; e-tkt- and the last four figures of its MAC address. Put that name here, or
; the address on the machine's screen.
custom_upload_url = http://e-tkt-xxxx.local/update

; Bench rigs. Each one is a firmware of its own that proves out or teaches one
; part of the machine, built from src/bench/<rig>.cpp in place of the label
; maker's LabelMaker.cpp, and flashed over serial:
;   pio run -e bench-hall -t upload && pio device monitor
; Flash serial-upload afterwards to put the label maker back.
[bench]
extends = esp32
upload_protocol = esptool
build_src_filter = +<*> -<LabelMaker.cpp> -<bench/> -<simulator/>

; The LEDs, the buzzer and the wifi-reset button. No motor moves.
[env:bench-selftest]
extends = bench
build_src_filter = ${bench.build_src_filter} +<bench/selftest.cpp>

; Six full turns of the feed motor.
[env:bench-feeder]
extends = bench
build_src_filter = ${bench.build_src_filter} +<bench/feeder.cpp>

; The daisy wheel's driver and motor, stepped by hand at three rates.
[env:bench-a4988]
extends = bench
build_src_filter = ${bench.build_src_filter} +<bench/a4988.cpp>

; Teaches REST_ANGLE and STAMP_ANGLE for Machine.h.
[env:bench-servo]
extends = bench
build_src_filter = ${bench.build_src_filter} +<bench/servo.cpp>

; Two slow turns of the wheel past the hall sensor, for HALL_SENSOR_THRESHOLD.
[env:bench-hall]
extends = bench
build_src_filter = ${bench.build_src_filter} +<bench/hall.cpp>

; Host-side unit tests. No Arduino, no servo, no board. Run with:
;   pio test -e native
;
; Two kinds of test live here. The pure ones (PressGeometry.h, Progress.h)
; need nothing but a header. The rest drive real firmware modules through the
; interfaces in src/Drivers.h and src/Display.h, handing them the recording
; fakes in test/fakes instead of the ESP32Servo, AccelStepper and OLED
; adapters the board gets. The fake steppers keep AccelStepper itself inside,
; turning nothing, to say when each step is due.
;
; test/stubs supplies just enough of the Arduino core, Preferences and
; ESP32Tone for those modules and AccelStepper to link, including a delay()
; that advances a virtual clock rather than sleeping, which is how the tests
; assert on dwell times and still run instantly.
;
; build_src_filter names the modules that compile off-target one by one.
; Adding to this list is a deliberate act: it means a module has been made
; host-compilable, which means it takes its drivers in rather than building
; them. The job runner, every module it drives, the Api, the button, what
; the machine keeps about its network and the supervisor of its link are on
; it. The OLED, the radio, the webserver in front of the Api and
; LabelMaker.cpp still need the board.
[env:native]
platform = native
build_flags = -std=gnu++11 -I src -I test/stubs -I test/fakes
build_src_filter = -<*> +<Press.cpp> +<Feeder.cpp> +<Light.cpp> +<Logger.cpp>
                  +<Utility.cpp> +<CharacterSet.cpp> +<ETKT.cpp>
                  +<DaisyWheel.cpp> +<HallSwitch.cpp> +<Settings.cpp>
                  +<Roll.cpp> +<Sound.cpp> +<Printhead.cpp> +<Api.cpp>
                  +<Motion.cpp> +<LastRun.cpp> +<Button.cpp>
                  +<NetworkSettings.cpp> +<LinkSupervisor.cpp>
lib_deps =
	${json.lib_deps}
	${stepper.lib_deps}
; AccelStepper says it is for the Arduino framework, which this env has none
; of, and the finder leaves it out for that. The stubs are what the library
; builds on here.
lib_compat_mode = off
; Without this the filter above has nothing to filter: the test runner leaves
; src/ out of the build entirely by default.
test_build_src = yes
test_framework = unity

; The simulator's device: the modules above, on the machine in test/fakes,
; answering the requests src/simulator/server.py relays to it over stdin. See
; src/simulator/main.cpp. `python3 -m src.simulator` builds it and serves the
; panel in front of it; the program lands in .pio/build/simulator/program.
; Not an extension of the native env, whose tests bring a main() of their own.
[env:simulator]
platform = native
build_flags = ${env:native.build_flags}
build_src_filter = ${env:native.build_src_filter} +<simulator/main.cpp>
lib_deps = ${env:native.lib_deps}
lib_compat_mode = ${env:native.lib_compat_mode}
